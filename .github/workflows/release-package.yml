name: Build Plugin Release

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  build-release-zip:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build WordPress plugin zip
        run: |
          chmod +x scripts/build-release-zip.sh
          scripts/build-release-zip.sh

      - name: Upload release asset
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" dist/zhd-elementor-blocks.zip --clobber

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhd-elementor-blocks
          path: dist/zhd-elementor-blocks.zip

