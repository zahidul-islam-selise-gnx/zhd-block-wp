name: Build Plugin Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-release-zip:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build WordPress plugin zip
        run: |
          chmod +x scripts/build-release-zip.sh
          scripts/build-release-zip.sh

      - name: Create GitHub release and attach plugin zip
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/zhd-elementor-blocks.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: zhd-elementor-blocks
          path: dist/zhd-elementor-blocks.zip
